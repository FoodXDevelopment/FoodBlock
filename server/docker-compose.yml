# A FoodBlock 1.6 node and its Postgres: docker compose -f server/docker-compose.yml up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodblock
      POSTGRES_USER: foodblock
      POSTGRES_PASSWORD: ${FOODBLOCK_DB_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodblock"]
      interval: 5s
      timeout: 3s
      retries: 5

  node:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "3111:3111"
    environment:
      - DATABASE_URL=postgresql://foodblock:${FOODBLOCK_DB_PASSWORD:-localdev}@db:5432/foodblock
      - PORT=3111
      - NODE_KEY=/keys/node-key.json
      - NODE_URL=${NODE_URL:-}
      - SPEAKS_FOR=${SPEAKS_FOR:-}
      - ADMISSION=${ADMISSION:-}
    # The node's key file, made by `fb key node-key.json --identity me.json`.
    volumes:
      - ${NODE_KEY_FILE:-./node-key.json}:/keys/node-key.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
