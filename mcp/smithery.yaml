startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      identityFile:
        type: string
        description: "A file holding the person's public side: her genesis and the blocks her device signed. It holds no key."
    required: [identityFile]
  commandFunction:
    |-
    (config) => ({
      command: "npx",
      args: ["-y", "foodblock-mcp"],
      env: { FOODBLOCK_IDENTITY: config.identityFile }
    })
