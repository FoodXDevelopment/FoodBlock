startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      identityFile:
        type: string
        description: "Optional file holding this server's identity, so its key chain carries on across runs."
    required: []
  commandFunction:
    |-
    (config) => ({
      command: "npx",
      args: ["-y", "foodblock-mcp"],
      env: config.identityFile ? { FOODBLOCK_IDENTITY: config.identityFile } : {}
    })
