name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js-sdk:
    name: JS SDK, conformance vectors, spec copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node spec/run-vectors.cjs
      - run: node spec/oracle/run.cjs
      - run: node test/sync-spec.cjs --check
      - run: npm test
        working-directory: sdk/javascript

  packaging:
    name: One version everywhere; every package packs (nothing is published)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - run: cargo rustc --release --features ffi --crate-type staticlib
        working-directory: sdk/rust
      - run: node tools/version-sync.cjs --pack

  protocol-model:
    name: Protocol model (exhaustive check of consent, allocation, equivocation, rotation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/tla/check.py

  protocol-model-tlc:
    name: Protocol model in TLC (${{ matrix.part }}; each deliberate bug is caught)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [identity, consent, allocation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: python3 tools/tla/run-tlc.py ${{ matrix.part }}

  wasm-core:
    name: JS and Go core (Rust built to WebAssembly) is the Rust source, rebuilt byte for byte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # the one compiler the core is built with (sdk/javascript/scripts/build-wasm.cjs, RUSTC)
      - run: rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
      - run: node scripts/build-wasm.cjs --check
        working-directory: sdk/javascript
      # the shipped bytes must be what this source builds to (security M): a swapped core/foodblock.wasm fails here, whatever BUILD.json says
      - run: node --test test/core.test.cjs
        working-directory: sdk/javascript
        env:
          FOODBLOCK_REBUILD: '1'
      - run: cmp sdk/javascript/core/foodblock.wasm sdk/go/foodblock.wasm

  python-sdk:
    name: Python SDK (over the Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo rustc --release --features ffi --crate-type cdylib
        working-directory: sdk/rust
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -e .
        working-directory: sdk/python
      - run: python -m unittest discover -s tests -v
        working-directory: sdk/python

  go-sdk:
    name: Go SDK (the Rust core as WebAssembly in wazero, pure Go, no cgo)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - run: go vet ./...
        working-directory: sdk/go
      - run: go test -v ./...
        working-directory: sdk/go

  swift-sdk:
    name: Swift SDK (the Rust core as an XCFramework)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: sdk/swift/scripts/build-xcframework.sh --macos
      - run: swift test

  node:
    name: Node (server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodblock
          POSTGRES_PASSWORD: test
          POSTGRES_DB: foodblock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm ci
        working-directory: server
      - name: Against in-memory Postgres
        run: npm test
        working-directory: server
      - name: Against real Postgres
        run: npm test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://foodblock:test@localhost:5432/foodblock_test

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm ci
        working-directory: cli
      - run: npm test
        working-directory: cli

  rust:
    name: Rust SDK (with C and C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test
        working-directory: sdk/rust
      - run: cargo test --no-default-features --features std,micro
        working-directory: sdk/rust
      - run: cargo check --no-default-features --features micro
        working-directory: sdk/rust
      - run: cargo test --features ffi
        working-directory: sdk/rust
      - run: cargo rustc --release --features ffi --crate-type staticlib && g++ -std=c++17 -Iinclude examples/cpp/sensor.cpp target/release/libfoodblock.a -lpthread -ldl -lm -o sensor && ./sensor
        working-directory: sdk/rust

  kotlin:
    name: Kotlin SDK (JVM, over the Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '17' }
      - run: ./gradlew :foodblock:test
        working-directory: sdk/kotlin
      - run: ./gradlew :foodblock:test -Pfoodblock.profile=micro
        working-directory: sdk/kotlin
      # the jar as a user gets it: the bundled library for this platform, no -Dfoodblock.library
      - run: scripts/build-natives.sh jvm
        working-directory: sdk/kotlin
      - run: ./gradlew :foodblock:testBundled
        working-directory: sdk/kotlin

  fuzz-smoke:
    name: Differential fuzz smoke (Rust core against the spec-only oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # the core on random and adversarial input: no panic, no hang, canonical round trips (about a minute)
      - run: cargo build --release --manifest-path tools/fuzz/Cargo.toml
      - run: tools/fuzz/target/release/fbfuzz run 1 60
      # the minimal reproducers of what fuzzing found, in the core and in the oracle
      - run: node tools/fuzz/run-vectors.cjs
      # generated worlds through the core and through the oracle; any disagreement not listed in tools/fuzz/known.json fails
      - run: node tools/fuzz/diff.cjs --seeds 1-25 --baseline tools/fuzz/known.json

  simulator:
    name: World simulator (fixed seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # peers, businesses, custodians, machines and attackers; offline nodes, a lossy network, clock skew; the invariants asserted after each run
      - run: cargo run --release --manifest-path tools/sim/Cargo.toml -- run --seeds 1-40 --peers 12 --steps 20 --jobs 4
