name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js-sdk:
    name: JS SDK, conformance vectors, spec copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node spec/run-vectors.cjs
      - run: node spec/oracle/run.cjs
      - run: node test/sync-spec.cjs --check
      - run: npm test
        working-directory: sdk/javascript

  wasm-core:
    name: JS core (Rust built to WebAssembly) is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-wasm.cjs --check
        working-directory: sdk/javascript

  python-sdk:
    name: Python SDK (over the Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo rustc --release --features ffi --crate-type cdylib
        working-directory: sdk/rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
        working-directory: sdk/python
      - run: python -m unittest discover -s tests -v
        working-directory: sdk/python

  go-sdk:
    name: Go SDK (over the Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo rustc --release --features ffi --crate-type staticlib
        working-directory: sdk/rust
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - run: go vet ./...
        working-directory: sdk/go
      - run: go test -v ./...
        working-directory: sdk/go

  swift-sdk:
    name: Swift SDK (over the Rust core)
    # A thin layer over the Rust core (sdk/rust), linked as a static library.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo rustc --release --features ffi --crate-type staticlib
        working-directory: sdk/rust
      - run: swift test
        working-directory: sdk/swift

  node:
    name: Node (server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodblock
          POSTGRES_PASSWORD: test
          POSTGRES_DB: foodblock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: server
      - name: Against in-memory Postgres
        run: npm test
        working-directory: server
      - name: Against real Postgres
        run: npm test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://foodblock:test@localhost:5432/foodblock_test

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: cli
      - run: npm test
        working-directory: cli

  rust:
    name: Rust SDK (with C and C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: sdk/rust
      - run: cargo test --no-default-features --features std,micro
        working-directory: sdk/rust
      - run: cargo check --no-default-features --features micro
        working-directory: sdk/rust
      - run: cargo test --features ffi
        working-directory: sdk/rust
      - run: cargo rustc --release --features ffi --crate-type staticlib && g++ -std=c++17 -Iinclude examples/cpp/sensor.cpp target/release/libfoodblock.a -lpthread -ldl -lm -o sensor && ./sensor
        working-directory: sdk/rust

  kotlin:
    name: Kotlin SDK (JVM, over the Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: ./gradlew :foodblock:test
        working-directory: sdk/kotlin
      - run: ./gradlew :foodblock:test -Pfoodblock.profile=micro
        working-directory: sdk/kotlin
