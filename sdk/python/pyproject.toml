[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodblock"
version = "1.6.0"
description = "FoodBlock 1.6 for Python: canonical form, signatures, the write check, key chains, identities, aliases, envelopes, folds and the messages between nodes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "FoodX", email = "developers@foodx.com"}]
dependencies = ["cryptography>=41.0.0"]
keywords = ["food", "foodblock", "protocol", "traceability", "provenance", "supply-chain"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.foodx.world/developers"
Documentation = "https://www.foodx.world/developers"
Source = "https://github.com/FoodXDevelopment/foodblock"

[tool.setuptools.packages.find]
include = ["foodblock*"]

# protocol.json and aliases.json, copied exactly from the repository's spec/ by test/sync-spec.cjs.
[tool.setuptools.package-data]
foodblock = ["spec/*.json"]
