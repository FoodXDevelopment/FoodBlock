[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodblock"
version = "1.6.0"
description = "FoodBlock 1.6 for Python: a thin layer over the one Rust core: canonical form, signatures, the write check, key chains, identities, envelopes, folds and the messages between nodes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "FoodX", email = "hello@foodx.world"}]
dependencies = []
keywords = ["food", "foodblock", "protocol", "traceability", "provenance", "supply-chain"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.foodx.world/developers"
Documentation = "https://www.foodx.world/developers"
Source = "https://github.com/FoodXDevelopment/FoodBlock"

[tool.setuptools.packages.find]
include = ["foodblock*"]

# The Rust core's shared library (libfoodblock), built into the package by setup.py.
[tool.setuptools.package-data]
foodblock = ["libfoodblock.*", "foodblock.dll"]
