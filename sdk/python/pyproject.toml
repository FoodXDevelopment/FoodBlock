[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodblock"
version = "1.6.0"
description = "FoodBlock 1.6 for Python: a thin layer over the one Rust core: canonical form, signatures, the write check, key chains, identities, envelopes, folds and the messages between nodes"
readme = "README.md"
license = {text = "MIT"}
maintainers = [{name = "FoodX", email = "developers@foodx.com"}]
requires-python = ">=3.10"
authors = [{name = "FoodX", email = "developers@foodx.com"}]
dependencies = []
keywords = ["food", "foodblock", "protocol", "traceability", "provenance", "supply-chain"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.foodx.network/developers"
Documentation = "https://www.foodx.network/developers"
Source = "https://github.com/FoodXDevelopment/FoodBlock"
Issues = "https://github.com/FoodXDevelopment/FoodBlock/issues"

[tool.setuptools.packages.find]
include = ["foodblock*"]

# The Rust core's shared library (libfoodblock), built into the package by setup.py.
[tool.setuptools.package-data]
foodblock = ["libfoodblock.*", "foodblock.dll"]

# The wheel holds a C library and no Python extension: tag it for the platform, not for one Python version.
[tool.distutils.bdist_wheel]
py-limited-api = "cp310"
