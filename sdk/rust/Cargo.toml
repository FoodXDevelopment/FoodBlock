[package]
name = "foodblock"
version = "1.7.0"
edition = "2021"
license = "CC0-1.0"
description = "FoodBlock for robots, vehicles, sensors and nodes: canonical form, SHA-256, Ed25519, the write check, chains, envelopes and folds, with a C ABI and a C++ layer."
repository = "https://github.com/FoodXDevelopment/FoodBlock"
homepage = "https://www.foodx.network/developers"
authors = ["FoodX <developers@foodx.com>"]
readme = "README.md"
keywords = ["foodblock", "protocol", "embedded", "robotics", "ed25519"]
categories = ["cryptography", "embedded", "no-std", "encoding"]
include = ["src/**", "spec/**", "include/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = ["std", "node", "suites", "successor", "ballots", "rekeys", "earnest", "door", "legacy"]
# The standard library: OS randomness for new keys, salts and envelopes. Without it the crate is no_std + alloc, and
# the caller hands in random bytes.
std = ["dep:getrandom", "serde_json/std"]
# The three profiles of protocol.json `profiles`. The micro core (canonical form, SHA-256, Ed25519, the write check,
# its own chain and the grant check) is always built; edge and node add to it.
micro = []
edge = ["micro", "folds", "sync"]
node = ["edge", "envelope"]
# The parts the profiles turn on.
folds = []
sync = []
envelope = ["dep:x25519-dalek", "dep:aes-gcm", "dep:hkdf"]
# The suites past std (core.md, Suites): p256 (ECDSA and ECDH on P-256) and sm (SM2, SM3, SM4). `std` is always built.
suites = ["dep:p256", "dep:sm2", "dep:sm3", "dep:sm4", "dep:elliptic-curve", "dep:ecdsa", "dep:hmac"]
# The optional profiles (spec/profiles): code that only a peer that adopts them needs.
successor = ["folds"]
ballots = ["folds"]
rekeys = ["folds"]
earnest = []
# The one-time converter for blocks from before 1.6 (spec/legacy/converter.md). Not part of the protocol.
legacy = ["envelope"]
# The JSON door (src/door.rs): one call, one data shape, shared by every language binding.
door = ["std", "node"]
# The C ABI (include/foodblock.h), JSON in and JSON out.
ffi = ["door", "std", "node", "suites", "successor", "ballots", "rekeys", "earnest", "legacy"]
# The WebAssembly door for the JavaScript SDK (sdk/javascript/core): the JSON door as plain exports; the host gives
# randomness and the clock. Build: node sdk/javascript/scripts/build-wasm.cjs
wasm = ["door", "std", "node", "suites", "successor", "ballots", "rekeys", "earnest", "legacy", "getrandom/custom"]
# The JNI door for Kotlin (sdk/kotlin): one native call, JSON in and out. Pick the profile beside it.
jni = ["door", "std", "dep:jni", "suites", "successor", "ballots", "rekeys", "earnest", "legacy"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.120", default-features = false, features = ["alloc", "preserve_order", "float_roundtrip", "unbounded_depth"] }
indexmap = { version = "2", default-features = false }
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"] }
unicode-normalization = { version = "0.1.23", default-features = false }
once_cell = { version = "1.19", default-features = false, features = ["race", "alloc"] }
getrandom = { version = "0.4", optional = true }
# buffers that held a key or a plaintext are overwritten before they are freed (release 46)
zeroize = { version = "1", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"], optional = true }
hkdf = { version = "0.13", default-features = false, optional = true }
jni = { version = "0.22", optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "arithmetic", "pkcs8"], optional = true }
sm2 = { version = "0.14", default-features = false, features = ["dsa", "arithmetic"], optional = true }
sm3 = { version = "0.5", default-features = false, optional = true }
sm4 = { version = "0.6", default-features = false, optional = true }
elliptic-curve = { version = "0.14", default-features = false, features = ["ecdh", "sec1", "arithmetic"], optional = true }
ecdsa = { version = "0.16", default-features = false, features = ["signing", "verifying", "arithmetic"], optional = true }
hmac = { version = "0.13", default-features = false, optional = true }

[profile.dev.package."*"]
# Signature checks run thousands of times in the conformance tests; keep the crypto fast in debug builds.
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

# The smallest build, for a micro device: cargo build --profile micro --no-default-features --features micro
[profile.micro]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true

# The WebAssembly build shipped in sdk/javascript/core: small, and a trap rather than unwinding.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true

# Which build each test needs: the micro build tests what it has (cargo test --no-default-features --features std,micro).
[[test]]
name = "api"
required-features = ["node", "suites"]

[[test]]
name = "vectors"
required-features = ["door", "legacy", "successor", "ballots", "rekeys", "earnest", "suites"]

[[test]]
name = "legacy"
required-features = ["legacy"]

[[test]]
name = "fuzz_vectors"
required-features = ["door", "legacy", "node"]
