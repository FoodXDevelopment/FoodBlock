\* TLC model for the consent part, two honest nodes. Run: tlc -config FoodBlock.consent.cfg FoodBlock.tla
SPECIFICATION Spec
SYMMETRY NodeSym
CONSTANTS
  Nodes = {n1, n2}
  Active = {"GR", "ASK", "ASK2", "ASK0", "YESq", "STOP", "YES", "STOPR", "ASKR", "ASKR2", "ASKZ"}
  Mut = "none"
INVARIANT
  TypeOK
  RefusedNeverStored
  WholeInput
  NothingLost
  StopReadByFold
  NoConsentStall
  RightSigner
  FrozenSilent
  NoForgeStored
  AllocationSafe
  Converge
CHECK_DEADLOCK FALSE   \* the machine ends when every push has been delivered; that is not an error
