\* TLC model for the allocation part, two honest nodes. Run: tlc -config FoodBlock.allocation.cfg FoodBlock.tla
SPECIFICATION Spec
SYMMETRY NodeSym
CONSTANTS
  Nodes = {n1, n2}
  Active = {"O", "A1", "A2", "AL1", "AL2", "AL2f", "AL3", "FAKE", "BADS"}
  Mut = "none"
INVARIANT
  TypeOK
  RefusedNeverStored
  WholeInput
  NothingLost
  StopReadByFold
  NoConsentStall
  RightSigner
  FrozenSilent
  NoForgeStored
  AllocationSafe
  Converge
CHECK_DEADLOCK FALSE   \* the machine ends when every push has been delivered; that is not an error
