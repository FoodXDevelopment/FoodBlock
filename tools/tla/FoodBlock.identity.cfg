\* TLC model for the identity part, two honest nodes. Run: tlc -config FoodBlock.identity.cfg FoodBlock.tla
SPECIFICATION Spec
SYMMETRY NodeSym
CONSTANTS
  Nodes = {n1, n2}
  Active = {"x1", "x2", "x2f", "ROT", "ROT2", "y1", "y2", "REC", "z1", "PR", "FR"}
  Mut = "none"
INVARIANT
  TypeOK
  RefusedNeverStored
  WholeInput
  NothingLost
  StopReadByFold
  NoConsentStall
  RightSigner
  FrozenSilent
  NoForgeStored
  AllocationSafe
  Converge
CHECK_DEADLOCK FALSE   \* the machine ends when every push has been delivered; that is not an error
